<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--p900:#3b0764;--p800:#5b21b6;--p700:#6d28d9;--p100:#ede9fe;--cream:#faf6f1;--ink:#1f1233;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:851px;height:315px;overflow:hidden;background:var(--cream)}
.cover{position:relative;width:851px;height:315px;overflow:hidden;
  background:radial-gradient(circle at 92% 10%,#e9ddff 0,transparent 42%),
             radial-gradient(circle at 60% 120%,#f6d9c7 0,transparent 45%),var(--cream);
  font-family:Inter,sans-serif;color:var(--ink)}
.sun{position:absolute;left:-80px;top:-110px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,#f8c9a0 0,#f3b182 45%,transparent 70%);opacity:.55}
.text{position:absolute;left:40px;top:44px;width:330px}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:9.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--p700);background:rgba(237,233,254,.9);padding:6px 11px;border-radius:999px}
.kicker i{width:7px;height:7px;border-radius:50%;background:var(--p700)}
h1{font-family:Fraunces,serif;font-weight:700;font-size:46px;line-height:1;margin-top:14px;letter-spacing:-.02em;color:var(--p900)}
h1 em{font-style:italic;font-weight:500;color:var(--p700)}
.lead{font-size:13px;line-height:1.5;margin-top:11px;color:#4a3f5c;max-width:300px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.tags span{font-size:10px;font-weight:500;padding:4px 9px;border-radius:999px;border:1px solid #d9cdf3;background:#fff;color:var(--p800)}
.handle{margin-top:14px;font-size:12px;font-weight:600;color:var(--p800);letter-spacing:.02em}
.strip{position:absolute;right:26px;top:0;height:315px;display:flex;gap:10px;align-items:center}
.card{width:104px;height:185px;border-radius:13px;overflow:hidden;background:#ddd;
  box-shadow:0 18px 40px -14px rgba(59,7,100,.45),0 0 0 3px #fff}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card:nth-child(1){transform:translateY(20px) rotate(-3deg)}
.card:nth-child(2){transform:translateY(-16px) rotate(1.5deg)}
.card:nth-child(3){transform:translateY(15px) rotate(-1.5deg)}
.card:nth-child(4){transform:translateY(-19px) rotate(3deg)}
.label{position:absolute;right:52px;bottom:18px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#8a7aa6}
</style></head>
<body><div class="cover">
  <div class="sun"></div>
  <div class="text">
    <div class="kicker"><i></i>Criadora de conteúdo UGC</div>
    <h1>Soraya <em>Oli</em></h1>
    <p class="lead">Conteúdo real, de rotina, que faz a pessoa do outro lado querer ter o produto.</p>
    <div class="tags"><span>Skincare</span><span>Cabelos</span><span>Casa</span><span>Acessórios</span><span>Alimentos</span></div>
    <div class="handle">@sorayaaoliroutine</div>
  </div>
  <div class="strip">
    <div class="card"><img src="file:///root/.claude/uploads/7ba80662-301d-5567-b694-55fc4a2b369e/b5c3bfd7-image.jpg"></div>
    <div class="card"><img src="file:///root/.claude/uploads/7ba80662-301d-5567-b694-55fc4a2b369e/53367e91-image.jpg"></div>
    <div class="card"><img src="file:///root/.claude/uploads/7ba80662-301d-5567-b694-55fc4a2b369e/ce824f58-image.jpg" style="object-position:40% 50%"></div>
    <div class="card"><img src="file:///root/.claude/uploads/7ba80662-301d-5567-b694-55fc4a2b369e/d0078334-image.jpg"></div>
  </div>
</div></body></html>
